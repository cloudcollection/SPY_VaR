name: Reproducibility checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest
      - run: python scripts/reproduce.py evaluate --output results/ci-cached
      - run: python scripts/reproduce.py evaluate --include-c2 --output results/ci-c2
      - run: python scripts/reproduce.py train --config configs/smoke.json --max-observations 160 --output results/ci-smoke
